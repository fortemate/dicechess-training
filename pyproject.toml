[project]
name = "dicechess-training"
version = "0.1.0"
description = "Open training pipeline for Dice Chess: label factory, chance-collapse value net, move pre-ranker"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "torch>=2.9",
  "onnx>=1.16",
  "onnxruntime>=1.19",
  "onnxscript>=0.7.1",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dicechess_training"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
