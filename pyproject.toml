[project]
name = "dicechess-training"
version = "0.1.0"
description = "Open training pipeline for Dice Chess: label factory, chance-collapse value net, move pre-ranker"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "torch>=2.9",
  "onnx>=1.16",
  "onnxruntime>=1.19",
  "onnxscript>=0.7.1",
]

[project.optional-dependencies]
cu128 = ["torch>=2.9; sys_platform == 'linux'"]

# CPU remains the Linux default. Explicit --extra cu128 selects CUDA for training.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'", group = "cpu" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'", extra = "cu128" },
]

[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { extra = "cu128" }]]

[dependency-groups]
cpu = ["torch>=2.9"]
dev = [
  "jsonschema>=4.23",
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dicechess_training"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
