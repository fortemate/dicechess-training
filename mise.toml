[tools]
python = "3.12"
uv = "latest"

[tasks.setup]
description = "Install dependencies into .venv"
run = "uv sync"

[tasks.check]
description = "Lint, format check, and tests — mirrors CI"
run = [
  "uv run ruff check .",
  "uv run ruff format --check .",
  "uv run pytest",
  "uv run python -m dicechess_training.demo --games 60 --epochs 1",
]

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks.format]
description = "Format and autofix"
run = ["uv run ruff format .", "uv run ruff check --fix ."]

[tasks.demo]
description = "End-to-end toy demo: data -> train -> metrics -> ONNX -> parity"
run = "uv run python -m dicechess_training.demo"

[tasks."golden:kcp13"]
description = "Regenerate the kcp-13 golden corpus from the released engine (needs JDK 21+ and sbt; not part of check)"
dir = "tools/kcp13-golden"
run = """
#!/usr/bin/env bash
set -euo pipefail
version="${ENGINE_VERSION:-0.9.3}"
out="${1:-../../tests/fixtures/kcp13/golden-engine-${version}.json}"
sbt -batch "-Dengine.version=${version}" "runMain dicechess.training.golden.Kcp13Golden ../../tests/fixtures/kcp13/probes.tsv ${out}"
"""

[tasks."check:enrichment"]
description = "JVM -> Parquet -> Python metadata and golden parity smoke (requires JDK 21 and sbt)"
run = "uv run python scripts/check_enrichment.py"
